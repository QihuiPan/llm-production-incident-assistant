# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

version: "1"

services:
  - type: web
    name: llm-incident-assistant
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.render-free
    dockerContext: .
    dockerCommand: sh -c 'python -m api.migrate && exec uvicorn api.main:app --host 0.0.0.0 --port "${PORT:-10000}"'
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: WEB_DIST_DIR
        value: /app/web-dist
      - key: STORAGE_BACKEND
        value: postgres
      - key: RETRIEVAL_MODE
        value: advanced
      - key: TOOL_BACKEND
        value: simulator
      - key: JOB_BACKEND
        value: inline
      - key: AUTH_ENABLED
        value: "true"
      - key: API_KEYS_JSON
        sync: false
      - key: ALLOWED_ORIGINS
        value: ""
      - key: LLM_PROVIDER
        value: deterministic
      - key: DAILY_COST_BUDGET_USD
        value: "5.00"
      - key: DATABASE_URL
        fromDatabase:
          name: llm-incident-assistant-db
          property: connectionString

databases:
  - name: llm-incident-assistant-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: incident_assistant
    user: incident_assistant
    ipAllowList: []
