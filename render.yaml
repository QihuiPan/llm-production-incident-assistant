# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

version: "1"

services:
  - type: pserv
    name: llm-incident-assistant-api
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: python -m api.migrate
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: STORAGE_BACKEND
        value: postgres
      - key: RETRIEVAL_MODE
        value: advanced
      - key: TOOL_BACKEND
        value: simulator
      - key: JOB_BACKEND
        value: rq
      - key: AUTH_ENABLED
        value: "true"
      - key: API_KEYS_JSON
        sync: false
      - key: ALLOWED_ORIGINS
        value: ""
      - key: LLM_PROVIDER
        value: deterministic
      - key: DAILY_COST_BUDGET_USD
        value: "5.00"
      - key: DATABASE_URL
        fromDatabase:
          name: llm-incident-assistant-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: llm-incident-assistant-queue
          type: keyvalue
          property: connectionString

  - type: worker
    name: llm-incident-assistant-worker
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh -c 'exec rq worker --url "$REDIS_URL" incident-assistant'
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: STORAGE_BACKEND
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: llm-incident-assistant-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: llm-incident-assistant-queue
          type: keyvalue
          property: connectionString

  - type: web
    name: llm-incident-assistant-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: API_UPSTREAM_HOSTPORT
        fromService:
          name: llm-incident-assistant-api
          type: pserv
          property: hostport

  - type: keyvalue
    name: llm-incident-assistant-queue
    plan: starter
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: journal-snapshot

databases:
  - name: llm-incident-assistant-db
    plan: 0.5c-1g
    region: singapore
    postgresMajorVersion: "17"
    databaseName: incident_assistant
    user: incident_assistant
    diskSizeGB: 10
    connectionPool: none
    ipAllowList: []
