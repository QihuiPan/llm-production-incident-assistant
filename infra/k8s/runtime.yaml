apiVersion: v1
kind: ConfigMap
metadata:
  name: incident-assistant-config
data:
  APP_ENV: production
  STORAGE_BACKEND: postgres
  RETRIEVAL_MODE: advanced
  TOOL_BACKEND: simulator
  JOB_BACKEND: rq
  AUTH_ENABLED: "true"
  ALLOWED_ORIGINS: https://incident-assistant.example.com
  LLM_PROVIDER: deterministic
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: incident-assistant-api
  template:
    metadata:
      labels:
        app: incident-assistant-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: ghcr.io/qihuipan/llm-production-incident-assistant:latest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: incident-assistant-config
            - secretRef:
                name: incident-assistant-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: incident-assistant-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: incident-assistant-worker
  template:
    metadata:
      labels:
        app: incident-assistant-worker
    spec:
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: ghcr.io/qihuipan/llm-production-incident-assistant:latest
          command: ["/bin/sh", "-c"]
          args: ["exec rq worker --url \"$REDIS_URL\" incident-assistant"]
          envFrom:
            - configMapRef:
                name: incident-assistant-config
            - secretRef:
                name: incident-assistant-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: incident-assistant-web
  template:
    metadata:
      labels:
        app: incident-assistant-web
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: ghcr.io/qihuipan/llm-production-incident-assistant-web:latest
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: temporary
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: incident-assistant-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: incident-assistant
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [incident-assistant.example.com]
      secretName: incident-assistant-tls
  rules:
    - host: incident-assistant.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
